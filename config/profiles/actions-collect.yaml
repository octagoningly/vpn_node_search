# Actions 候选拉取：GitHub 代码搜索发现 CF 优选/ADDAPI 候选，默认只 collect+score 粗筛。
# 注意：Actions 测速反映的是 GitHub 机房网络，不是用户本地网络，因此 probe 默认关闭；
#       真实测速请在本机跑（见 .github/workflows/README.md「Actions 发现候选 vs 本机测速」）。
profile: actions-collect
runner_id: actions:collect
sources:
  local:
    enabled: false
  subscriptions:
    enabled: false
  github:
    enabled: true
    allowed_repositories:
      - cmliu/WorkerVless2sub
      - cmliu/edgetunnel
      - XIU2/CloudflareSpeedTest
      - 735754647/Free-Nodes
    queries:
      - 'filename:addressesapi.txt'
      - 'filename:addressescsv.csv'
      - 'filename:addressesipv6api.txt'
      - 'filename:cf-addapi.txt'
      - '"IP地址" filename:addressescsv.csv'
      - 'Cloudflare 优选 filename:addressesapi.txt'
    max_files_per_run: 20
    cache_ttl_hours: 24
    offline: false
  cf:
    # 可指向 import 的候选清单，或清空 candidate_files（空列表会报 no_files）。
    enabled: true
    candidate_files:
      - candidates/cf-user-20260928.txt
    max_ips_per_run: 150
  candidate_import:
    enabled: false
probe:
  # Actions 网络≠用户网络：默认只 collect+score 粗筛，proxy/CF 测速都关。
  proxy:
    enabled: false
  cf:
    enabled: false
    cfst_path: tools/cfst/CloudflareSpeedTest.exe
    target_host: octagoningly-vpn.pages.dev
    speedtest_url: ""
    max_nodes: 400
    max_download_nodes: 50
    total_deadline_s: 300
    allowed_ports:
      - 443
      - 8443
      - 2087
      - 2053
      - 80
      - 8080
      - 8880
      - 2052
      - 2082
      - 2083
      - 2086
      - 2095
      - 2096
publish:
  enabled: false
  allow_proxy_credentials: false
  cf_candidates_authorized: false
