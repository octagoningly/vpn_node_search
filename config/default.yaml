profile: local
runner_id: local:desktop-a
sources:
  local:
    enabled: true
    paths:
      - input/
  subscriptions:
    enabled: false
    urls: []
  github:
    enabled: false
    allowed_repositories: []
    queries:
      - '"vless://" filename:sub.txt'
    max_files_per_run: 30
    cache_ttl_hours: 24
  cf:
    enabled: false
    candidate_files: []
    max_ips_per_run: 200
probe:
  proxy:
    enabled: true
    concurrency: 10
    max_nodes: 100
    max_download_mb_each: 5
    speedtest_url: ""
    mihomo_path: ""
    api_timeout_s: 10
    per_node_timeout_s: 20
    total_deadline_s: 300
  cf:
    enabled: false
    concurrency: 20
    max_download_nodes: 20
    target_host: octagoningly-vpn.pages.dev
    speedtest_url: ""
    cfst_path: ""
    tcp_timeout_s: 5
    tls_timeout_s: 5
    http_timeout_s: 5
    total_deadline_s: 600
    allowed_ports:
      - 443
    ip_family: "4"
intelligence:
  reputation_enabled: false
history:
  days: 14
scoring:
  weights:
    latency: 0.25
    speed: 0.25
    purity: 0.25
    stability: 0.15
    loss: 0.10
  cf_weights:
    compatibility: 0.35
    latency: 0.25
    speed: 0.25
    loss: 0.15
  filters:
    require_real_probe_success: true
    max_latency_ms: 800.0
    min_speed_mb_s: 0.5
    max_risk: 50.0
    allowed_countries: []
    missing: pending
    stability_min_samples: 3
publish:
  enabled: false
  allow_proxy_credentials: false
  cf_candidates_authorized: false
scheduler:
  enabled: true
  default_time: "04:37"
budget: {}
output_dir: output
