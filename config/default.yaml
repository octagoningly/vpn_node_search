profile: local
runner_id: local:desktop-a
sources:
  local:
    enabled: true
    paths:
      - input/
  subscriptions:
    enabled: false
    urls: []
    timeout_s: 15
    user_agent: "NodeBench/0.1 (+https://github.com/local/nodebench; bounded-research)"
    offline: false
    license_tag: unknown
  github:
    enabled: false
    allowed_repositories: []
    queries:
      - '"vless://" filename:sub.txt'
    max_files_per_run: 30
    cache_ttl_hours: 24
    timeout_s: 15
    user_agent: "NodeBench/0.1 (+https://github.com/local/nodebench; bounded-research)"
    offline: false
  cf:
    enabled: false
    candidate_files: []
    max_ips_per_run: 200
  candidate_import:
    enabled: false
    files: []
    license_tag: user_supplied
    max_ips_per_run: 200
probe:
  proxy:
    enabled: true
    concurrency: 10
    max_nodes: 100
    max_download_mb_each: 5
    speedtest_url: ""
    mihomo_path: tools/mihomo/mihomo.exe
    api_timeout_s: 10
    per_node_timeout_s: 20
    total_deadline_s: 300
    # 测速默认绕过本地代理（Clash/TUN），避免测到代理出口速度
    bypass_system_proxy: true
  cf:
    enabled: false
    concurrency: 20
    max_download_nodes: 20
    target_host: octagoningly-vpn.pages.dev
    speedtest_url: ""
    speedtest_urls:
      - https://speed.cloudflare.com/__down?bytes=5000000
      - https://cf.090227.xyz/__down?bytes=5000000
      - http://speed.okl.abrdns.com/__down?bytes=5000000
    cfst_path: tools/cfst/CloudflareSpeedTest.exe
    tcp_timeout_s: 5
    tls_timeout_s: 5
    http_timeout_s: 5
    total_deadline_s: 600
    allowed_ports:
      - 443
    ip_family: "4"
    bypass_system_proxy: true
intelligence:
  reputation_enabled: true
  echo_url: ""
  geo_url: "http://ip-api.com/json"
  reputation_url: ""
  timeout: 5.0
history:
  days: 14
  retention_days: 14
scoring:
  weights:
    latency: 0.25
    speed: 0.25
    purity: 0.25
    stability: 0.15
    loss: 0.10
  cf_weights:
    compatibility: 0.25
    latency: 0.17
    speed: 0.17
    loss: 0.11
    purity: 0.15
    stability: 0.15
  filters:
    require_real_probe_success: true
    require_speed: true
    max_latency_ms: 800.0
    min_speed_mb_s: 0.3
    max_risk: 50.0
    allowed_countries: []
    missing: pending
    stability_min_samples: 3
  diversity:
    # 地区配额：默认关闭，避免同一地区好节点被砍掉。
    # 需要地域多样性时再打开，并设置每地区上限。
    enabled: false
    per_region: 15
    max_total: 0
publish:
  enabled: false
  allow_proxy_credentials: false
  cf_candidates_authorized: false
  upload:
    enabled: false
    backend: folder   # folder | github | http
    folder_path: ""   # folder backend
    github:
      repository: ""  # owner/repo
      branch: "public"
      path_prefix: "nodebench"
      token_env: "GITHUB_TOKEN"
    http:
      url: ""
      method: "PUT"
scheduler:
  enabled: true
  default_time: "04:37"
budget: {}
output_dir: output
addapi_remark_template: speed-purity-stability-country
