sources:
  local:
    enabled: true
    paths:
      - input/
  subscriptions:
    enabled: false
    urls: []
    timeout_s: 15
    user_agent: "NodeBench/0.1 (+https://github.com/local/nodebench; bounded-research)"
    offline: false
  github:
    enabled: false
    allowed_repositories: []
    queries:
      - '"vless://" filename:sub.txt'
    max_files_per_run: 30
    cache_ttl_hours: 24
    timeout_s: 15
    user_agent: "NodeBench/0.1 (+https://github.com/local/nodebench; bounded-research)"
    offline: false
  cf:
    enabled: false
    candidate_files: []
    max_ips_per_run: 200
