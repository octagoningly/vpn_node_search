name: NodeBench Daily Run

on:
  workflow_dispatch:
  schedule:
    # UTC 03:37 → 上海（Asia/Shanghai, UTC+8）约 11:37
    - cron: "37 3 * * *"

permissions:
  contents: read

concurrency:
  group: nodebench-daily
  # 不取消进行中的任务，避免并行写 output 时互相覆盖
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up UV
        uses: astral/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run doctor
        run: uv run nodebench doctor

      - name: Run local profile
        run: uv run nodebench run --profile local --no-publish

      # 仅上传脱敏后的诊断/报告产物：
      # 不包含 nodebench.db、私有 URI、token、完整订阅原文
      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodebench-daily-output
          path: |
            output/**/report*
            output/**/manifest*
            output/**/dry-run*
            output/**/dry_run*
            output/**/diagnostics*
          if-no-files-found: warn
          retention-days: 7

      # 发布步骤默认关闭，与 run 分离；仅在 vars.NODEBENCH_PUBLISH_ENABLED == 'true' 时执行
      - name: Publish reports (opt-in)
        if: ${{ vars.NODEBENCH_PUBLISH_ENABLED == 'true' }}
        env:
          NODEBENCH_PUBLISH_TOKEN: ${{ secrets.NODEBENCH_PUBLISH_TOKEN }}
        run: |
          if [ -z "${NODEBENCH_PUBLISH_TOKEN}" ]; then
            echo "NODEBENCH_PUBLISH_TOKEN is not configured; skipping publish."
            exit 0
          fi
          # 仅对本轮 run-id 执行导出与本地 output/latest 发布，不重新探测
          RUN_ID="$(ls -1 output | grep -E '^[0-9]{8}T[0-9]{6}Z-' | sort | tail -n 1)"
          if [ -z "${RUN_ID}" ]; then
            echo "No run id found under output/; skipping publish."
            exit 0
          fi
          uv run nodebench run --profile local --run-id "${RUN_ID}"
